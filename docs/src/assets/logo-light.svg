<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="cherenkovL" x1="12" y1="12" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="calorimeterL" x1="70" y1="16" x2="114" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Outer Muon Spectrometer Octagon -->
  <polygon points="44,8 84,8 120,44 120,84 84,120 44,120 8,84 8,44"
           stroke="url(#cherenkovL)" stroke-width="4.5" fill="#f0f9ff" />

  <!-- Segmented Calorimeter Barrel Ring -->
  <circle cx="64" cy="64" r="40" stroke="#cbd5e1" stroke-width="10" />
  <circle cx="64" cy="64" r="40" stroke="#94a3b8" stroke-width="10" stroke-dasharray="12 6" opacity="0.65" />

  <!-- High-ET Localized Jet Cluster Deposit -->
  <path d="M 88 32 A 40 40 0 0 1 103 55" stroke="url(#calorimeterL)" stroke-width="12" stroke-linecap="round" />
  <path d="M 96 24 L 112 18 M 106 38 L 120 34" stroke="#ea580c" stroke-width="3" stroke-linecap="round" />

  <!-- Inner Silicon Tracker Ring -->
  <circle cx="64" cy="64" r="22" stroke="#0891b2" stroke-width="2" stroke-dasharray="4 4" opacity="0.85" />

  <!-- Curved Di-Muon High-pT Particle Tracks -->
  <path d="M 64 64 Q 44 46 20 26" stroke="#0891b2" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 64 64 Q 82 86 104 106" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 64 64 Q 78 52 94 40" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />

  <!-- Muon Chamber Hit Markers -->
  <circle cx="20" cy="26" r="4.5" fill="#0891b2" />
  <circle cx="104" cy="106" r="4.5" fill="#0284c7" />

  <!-- Central Collision Vertex -->
  <circle cx="64" cy="64" r="6.5" fill="#0f172a" />
  <circle cx="64" cy="64" r="3" fill="#22d3ee" />
</svg>
