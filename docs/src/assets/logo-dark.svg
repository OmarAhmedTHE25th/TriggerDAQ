<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="cherenkov" x1="12" y1="12" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="calorimeter" x1="70" y1="16" x2="114" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <radialGradient id="vertexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Muon Spectrometer Octagon -->
  <polygon points="44,8 84,8 120,44 120,84 84,120 44,120 8,84 8,44"
           stroke="url(#cherenkov)" stroke-width="4" fill="#0b1220" />

  <!-- Segmented Calorimeter Barrel Ring -->
  <circle cx="64" cy="64" r="40" stroke="#1e293b" stroke-width="10" />
  <circle cx="64" cy="64" r="40" stroke="#334155" stroke-width="10" stroke-dasharray="12 6" opacity="0.7" />

  <!-- High-ET Localized Jet Cluster Deposit (Calorimeter Amber) -->
  <path d="M 88 32 A 40 40 0 0 1 103 55" stroke="url(#calorimeter)" stroke-width="12" stroke-linecap="round" />
  <path d="M 96 24 L 112 18 M 106 38 L 120 34" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />

  <!-- Inner Silicon Tracker Ring -->
  <circle cx="64" cy="64" r="22" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4" opacity="0.85" />

  <!-- Curved Di-Muon High-pT Particle Tracks -->
  <path d="M 64 64 Q 44 46 20 26" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 64 64 Q 82 86 104 106" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 64 64 Q 78 52 94 40" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />

  <!-- Muon Chamber Hit Markers -->
  <circle cx="20" cy="26" r="4.5" fill="#22d3ee" />
  <circle cx="104" cy="106" r="4.5" fill="#38bdf8" />

  <!-- Central Beam-Pipe Collision Vertex -->
  <circle cx="64" cy="64" r="14" fill="url(#vertexGlow)" opacity="0.65" />
  <circle cx="64" cy="64" r="5" fill="#ffffff" />
</svg>
